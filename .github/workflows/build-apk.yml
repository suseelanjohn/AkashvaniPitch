name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository Code
      uses: actions/checkout@v4

    - name: 2. Remove Empty Wrapper Files
      run: |
        rm -rf gradle/wrapper
        rm -f gradlew gradlew.bat

    - name: 3. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 4. Install Gradle Automatically (Validation Disabled)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        validate-wrappers: false

    - name: 5. Locate Project Root and Build Debug APK
      run: |
        SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)

        if [ -z "$SETTINGS_FILE" ]; then
          echo "##[error]CRITICAL: settings.gradle.kts is missing! Make sure settings.gradle.kts, build.gradle.kts, and the app/ folder are uploaded to GitHub."
          exit 1
        fi

        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        echo "Building Android project in directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        gradle assembleDebug --stacktrace

    - name: 6. Upload Compiled APK
      uses: actions/upload-artifact@v4
      with:
        name: akashvani-pitch-debug-apk
        path: '**/*.apk'
        if-no-files-found: error
