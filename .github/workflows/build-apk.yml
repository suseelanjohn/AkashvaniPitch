name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository Code
      uses: actions/checkout@v4

    - name: 2. Remove Empty Wrapper Files
      run: |
        rm -rf gradle/wrapper
        rm -f gradlew gradlew.bat

    - name: 3. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 4. Install Gradle Automatically
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        validate-wrappers: false

    - name: 5. Enable AndroidX and Build Debug APK
      run: |
        SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)

        if [ -z "$SETTINGS_FILE" ]; then
          echo "##[error]CRITICAL: settings.gradle.kts is missing!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        cd "$PROJECT_DIR"

        # Automatically create gradle.properties with AndroidX enabled
        cat <<EOF > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        android.nonTransitiveRClass=true
        EOF

        gradle assembleDebug --stacktrace

    - name: 6. Upload Compiled APK
      uses: actions/upload-artifact@v4
      with:
        name: akashvani-pitch-debug-apk
        path: '**/*.apk'
        if-no-files-found: error
