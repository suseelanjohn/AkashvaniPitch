name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository Code
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Install Gradle Automatically (No gradlew needed)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: 4. Locate Project Root and Build Debug APK
      run: |
        echo "--- Checking uploaded files in repository ---"
        find . -maxdepth 4 -not -path '*/.*'

        # Find where settings.gradle.kts is located
        SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)

        if [ -z "$SETTINGS_FILE" ]; then
          echo "##[error]CRITICAL: settings.gradle.kts is missing! You must upload all project files (settings.gradle.kts, build.gradle.kts, and the app/ folder) to GitHub."
          exit 1
        fi

        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        echo "Found Android project in directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # Run Gradle directly without needing gradlew
        gradle assembleDebug --stacktrace

    - name: 5. Upload Compiled APK
      uses: actions/upload-artifact@v4
      with:
        name: akashvani-pitch-debug-apk
        path: '**/*.apk'
        if-no-files-found: error
