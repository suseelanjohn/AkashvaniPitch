name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Check Workspace Files
      run: ls -la

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || echo "No gradlew found"

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "ERROR: gradlew file is missing from repository root!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: akashvani-pitch-debug-apk
        path: '**/app-debug.apk'
